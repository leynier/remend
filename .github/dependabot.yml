version: 2
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci"
